# G1 linked companies (research/prereg/G1.md, tracks/main/g1_links.py). Manual runs only, in order:
#   stage=links until it prints LINKS (resumes per batch), then the hand check of
#   research/results/G1/G1_links_check.csv, then stage=contracts (8-K material agreements, exploratory) and
#   stage=screen. stage=card with a symbol writes one link card. stage=g2check builds G2's stricter links
#   (research/prereg/G2.md) from G1's stored sentences and its hand-check file.
# Shares the M3/M4 data cache (same month-end panel). Results are committed back to the branch that ran it.
name: g1-links

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "links, contracts, screen, card, g2check or g2screen"
        required: true
        default: links
      symbol:
        description: "for stage=card: the stock symbol"
        required: false
        default: ""

permissions: {}

jobs:
  screen:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Python and packages
        run: |
          uv python install 3.12.10
          uv venv --python 3.12.10 .venv
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: Check secrets are present
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          [[ -n "$ALPACA_API_KEY_ID" ]] || { echo "::error::secret ALPACA_API_KEY_ID is missing"; exit 1; }
          [[ -n "$SEC_USER_AGENT" ]] || { echo "::error::secret SEC_USER_AGENT is missing (your name and email, required by SEC)"; exit 1; }

      - name: Restore the data cache
        uses: actions/cache/restore@v4
        with:
          path: cache/m4
          key: m4-screen-v1-${{ github.run_id }}
          restore-keys: m4-screen-v1-

      - name: Run the stage
        env:
          STAGE: ${{ github.event.inputs.stage }}
          SYMBOL: ${{ github.event.inputs.symbol }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ "$STAGE" = g2check ] || [ "$STAGE" = g2screen ]; then
            .venv/bin/python -m tracks.main.g2_links --stage "${STAGE#g2}" --cache cache/m4 --out research/results/G2
            exit 0
          fi
          .venv/bin/python -m tracks.main.g1_links --stage "$STAGE" --symbol "$SYMBOL" --cache cache/m4 --out research/results/G1 --budget-min 290

      - name: Save the data cache (also after a failure, so a rerun skips the downloads)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache/m4
          key: m4-screen-v1-${{ github.run_id }}

      - name: Commit the results to this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p research/results/G1 research/results/G2 && git add research/results/G1 research/results/G2
          git diff --cached --quiet && { echo "No results yet (links unfinished); rerun to continue"; exit 0; }
          git commit -q -m "G1 output (run ${{ github.run_id }})"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=$auth" pull -q --rebase origin "${GITHUB_REF_NAME}"
          git -c "http.extraheader=$auth" push -q origin "HEAD:${GITHUB_REF_NAME}"
