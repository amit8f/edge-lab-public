# L1 first-public-moment study (research/prereg/L1.md); its own data cache, resumable (rerun until it prints the report). Runs on demand only (Actions tab, "Run workflow").
# Writes research/results/L1/ and commits it back to the branch that ran it.
name: l1-study

on:
  workflow_dispatch:

permissions: {}

jobs:
  screen:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Python and packages
        run: |
          uv python install 3.12.10
          uv venv --python 3.12.10 .venv
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: Check secrets are present
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
        run: |
          [[ -n "$ALPACA_API_KEY_ID" ]] || { echo "::error::secret ALPACA_API_KEY_ID is missing"; exit 1; }

      - name: Restore the data cache
        uses: actions/cache/restore@v4
        with:
          path: cache/l1
          key: l1-study-v1-${{ github.run_id }}
          restore-keys: l1-study-v1-

      - name: Run the screen
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: .venv/bin/python -m tracks.news.l1_study --cache cache/l1 --out research/results/L1 --budget-min 240

      - name: Save the data cache (also after a failure, so a rerun skips the downloads)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache/l1
          key: l1-study-v1-${{ github.run_id }}

      - name: Commit the results to this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/L1 || true
          git diff --cached --quiet && { echo "no report yet (measure stage continues on the next run)"; exit 0; }
          git commit -q -m "L1 study results (run ${{ github.run_id }})"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=$auth" pull -q --rebase origin "${GITHUB_REF_NAME}"
          git -c "http.extraheader=$auth" push -q origin "HEAD:${GITHUB_REF_NAME}"
