# CRY-TREND forward book (tracks/crypto/trend_live.py, research/prereg/CRYPTO.md Amendment 2). Ledger only: no orders.
# Runs after the UTC day ends and logs every finished day not yet logged, so a run GitHub skips is caught up by the
# next one. State lives on the orphan branch `state-crytrend`.
name: crypto-trend

on:
  schedule:
    - cron: "20 0 * * *"
    - cron: "20 3 * * *"
    - cron: "20 9 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: crytrend-state
  cancel-in-progress: false

jobs:
  book:
    if: github.repository != 'amit8f/edge-lab'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Python and packages
        run: |
          uv python install 3.12.10
          uv venv --python 3.12.10 .venv
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: Restore the state branch
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_BRANCH: state-crytrend
        run: bash deploy/state.sh restore

      - name: Log the finished days
        env:
          PYTHONUNBUFFERED: "1"
        run: PYTHONPATH=. .venv/bin/python -m tracks.crypto.trend_live --state state

      - name: Save the state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_BRANCH: state-crytrend
          RUN_LABEL: crypto-trend ${{ github.run_id }}-${{ github.run_attempt }}
        run: bash deploy/state.sh save
