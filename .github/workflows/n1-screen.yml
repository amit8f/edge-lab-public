# N1 historical screen (research/prereg/N1.md, tracks/news/n1_screen.py). Run by hand in order:
#   stage=data once; stage=labels once a day until it reports "labels complete" (free-tier daily quotas;
#   the daily schedule does this when the repository variable N1_LABELS is true); then, after the hand
#   check is committed as research/results/N1/label_check.md, stage=returns.
# N1B (research/prereg/N1B.md) replaces N1: the schedule labels N1B's 15,000 headlines daily at 08:15 UTC; dispatch with idea=n1b and stage=returns once the hand check is committed.
# Results are committed back to the branch that ran it.
name: n1-screen

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "data, labels or returns"
        required: true
        default: labels
      idea:
        description: "n1 or n1b"
        required: true
        default: n1b
  schedule:
    - cron: "15 8 * * *"     # N1B labels right after Gemini's daily quota resets (midnight Pacific)

concurrency:
  group: n1-screen
  cancel-in-progress: false

permissions: {}

jobs:
  screen:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Python and packages
        run: |
          uv python install 3.12.10
          uv venv --python 3.12.10 .venv
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: Restore the data cache
        uses: actions/cache/restore@v4
        with:
          path: cache/n1
          key: n1-v1-${{ github.run_id }}
          restore-keys: n1-v1-

      - name: Bring back the committed labels if the cache lost them
        run: |
          # GitHub evicts caches when the repository passes its size limit (N1B's was lost 2026-11-14 with 7,650
          # labels). The label files hold only a headline hash and POS/NEG/NEU, so they are also kept in git.
          mkdir -p cache/n1
          for f in research/results/N1B/labels/*.jsonl; do
            [ -e "$f" ] || continue
            b="cache/n1/$(basename "$f")"
            if [ ! -e "$b" ] || [ "$(wc -l < "$f")" -gt "$(wc -l < "$b")" ]; then cp "$f" "$b"; fi
          done

      - name: Run the stage
        env:
          STAGE: ${{ github.event.inputs.stage || 'labels' }}
          IDEA: ${{ github.event.inputs.idea || 'n1b' }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: .venv/bin/python -m tracks.news.n1_screen --stage "$STAGE" --idea "$IDEA" --cache cache/n1 --out "research/results/${IDEA^^}" --budget-min 90

      - name: Save the data cache (also after a failure)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache/n1
          key: n1-v1-${{ github.run_id }}

      - name: Copy the labels so far into the results (hash and label only, no headline text)
        if: always()
        run: |
          mkdir -p research/results/N1B/labels
          cp cache/n1/labels_n1b_*.jsonl research/results/N1B/labels/ 2>/dev/null || true

      - name: Commit the results to this branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          IDEA: ${{ github.event.inputs.idea || 'n1b' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/N1 research/results/N1B
          if git diff --cached --quiet; then echo "no new results"; exit 0; fi
          git commit -q -m "${IDEA^^} screen output (run ${{ github.run_id }})"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=$auth" pull -q --rebase origin "${GITHUB_REF_NAME}"
          git -c "http.extraheader=$auth" push -q origin "HEAD:${GITHUB_REF_NAME}"
