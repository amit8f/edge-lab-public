# BIGNEWS (tracks/news/bignews_study.py, research/prereg/BIGNEWS.md): events from every 2019-2025 headline, then
# 1-minute prices (extended hours) around each event. Manual runs only; rerun until a stage prints that it is
# done (each stage resumes from its cache). Reads NX1's cache (nx1-v1-*) read-only; nothing is committed (the
# cache holds headlines, which stay out of this public repo).
name: bignews-study

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "events or minutes"
        required: true
        default: events

permissions: {}

concurrency:
  group: bignews-study
  cancel-in-progress: false

jobs:
  run:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Python and packages
        run: |
          uv python install 3.12.10
          uv venv --python 3.12.10 .venv
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: Restore NX1's cache (read only)
        uses: actions/cache/restore@v4
        with:
          path: cache/nx1
          key: nx1-v1-none
          restore-keys: nx1-v1-
          fail-on-cache-miss: true

      - name: Restore BIGNEWS's own cache
        uses: actions/cache/restore@v4
        with:
          path: cache/bignews
          key: bignews-v1-${{ github.run_id }}
          restore-keys: bignews-v1-

      - name: Run the stage
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          STAGE: ${{ inputs.stage }}
        run: |
          PYTHONPATH=. .venv/bin/python -u -m tracks.news.bignews_study --stage "$STAGE" --cache cache/nx1 \
            --out cache/bignews --budget-min 300

      - name: Save BIGNEWS's cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache/bignews
          key: bignews-v1-${{ github.run_id }}
