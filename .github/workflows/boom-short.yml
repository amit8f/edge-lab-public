# BOOM-SHORT forward shadow book (tracks/main/boom_short.py, research/prereg/BOOMSHORT.md). Ledger only: no orders.
# The morning runs decide the day before the open (the code waits until 9:28 ET, so the crons are DST-proof:
# 12:45 and 13:15 UTC cover summer time, 13:45 and 14:15 UTC winter; a run that finds the day decided exits).
# The evening runs settle every decided day from SIP minute bars. State lives on the orphan branch `state-boomshort`.
name: boom-short

on:
  schedule:
    - cron: "45 12 * * 1-5"
    - cron: "15 13 * * 1-5"
    - cron: "45 13 * * 1-5"
    - cron: "15 14 * * 1-5"
    - cron: "40 21 * * 1-5"
    - cron: "40 23 * * 1-5"
  workflow_dispatch:
    inputs:
      check:
        description: "true = read every source once and print counts (no state)"
        required: false
        default: "false"
      settle_only:
        description: "true = only settle days already decided"
        required: false
        default: "false"

permissions: {}

concurrency:
  group: boomshort-state
  cancel-in-progress: false

jobs:
  book:
    if: github.repository != 'amit8f/edge-lab'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Python and packages (CPU-only torch for FinBERT, as in nx3-live)
        run: |
          uv python install 3.12.10
          uv venv --python 3.12.10 .venv
          uv pip install --python .venv/bin/python -r requirements.txt
          uv pip install --python .venv/bin/python torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .venv/bin/python transformers==5.18.0

      - name: Check the sources once
        if: inputs.check == 'true'
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: PYTHONPATH=. .venv/bin/python -u -m tracks.main.boom_short --check

      - name: Restore the state branch
        if: inputs.check != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_BRANCH: state-boomshort
        run: bash deploy/state.sh restore

      - name: Decide today (morning runs) and settle
        if: inputs.check != 'true'
        env:
          PYTHONUNBUFFERED: "1"
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          SETTLE_ONLY: ${{ inputs.settle_only == 'true' || (github.event_name == 'schedule' && (github.event.schedule == '40 21 * * 1-5' || github.event.schedule == '40 23 * * 1-5')) }}
        run: |
          if [[ "$SETTLE_ONLY" == "true" ]]; then extra=--settle-only; else extra=; fi
          PYTHONPATH=. .venv/bin/python -m tracks.main.boom_short --state state $extra

      - name: Save the state
        if: always() && inputs.check != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_BRANCH: state-boomshort
          RUN_LABEL: boom-short ${{ github.run_id }}-${{ github.run_attempt }}
        run: bash deploy/state.sh save
