# PICK2-BAD forward book (tracks/main/pick2_bad_live.py, research/prereg/PICK2.md Amendment 2). Ledger only: no
# orders. Runs after the close and logs every finished session not yet logged, oldest first, so a run GitHub skips
# is caught up by the next one. State lives on the orphan branch `state-pick2bad`.
name: pick2-bad

on:
  schedule:
    - cron: "45 21 * * 1-5"
    - cron: "30 1 * * 2-6"
    - cron: "30 10 * * 2-6"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pick2bad-state
  cancel-in-progress: false

jobs:
  book:
    if: github.repository != 'amit8f/edge-lab'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Python and packages (CPU-only torch for FinBERT)
        run: |
          uv python install 3.12.10
          uv venv --python 3.12.10 .venv
          uv pip install --python .venv/bin/python -r requirements.txt
          uv pip install --python .venv/bin/python torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .venv/bin/python transformers==5.18.0

      - name: Restore the state branch
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_BRANCH: state-pick2bad
        run: bash deploy/state.sh restore

      - name: Log the finished sessions
        env:
          PYTHONUNBUFFERED: "1"
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: PYTHONPATH=. .venv/bin/python -m tracks.main.pick2_bad_live --state state

      - name: Save the state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_BRANCH: state-pick2bad
          RUN_LABEL: pick2-bad ${{ github.run_id }}-${{ github.run_attempt }}
        run: bash deploy/state.sh save
