# S1: one-off historical screen of the 5-minute VWAP snap-back scalp (tracks/main/s1_vwap.py,
# research/prereg/S1.md). Manual start only. Results go to the orphan branch `state-s1` under s1/.
name: s1-screen

on:
  workflow_dispatch:
    inputs:
      market:
        description: "stocks, crypto or both"
        type: choice
        options: [both, stocks, crypto]
        default: both

permissions: {}

concurrency:
  group: s1-state
  cancel-in-progress: false

jobs:
  screen:
    if: github.repository != 'amit8f/edge-lab'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Python and packages
        run: |
          uv python install 3.12.10
          uv venv --python 3.12.10 .venv
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: Restore the S1 state branch
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_BRANCH: state-s1
        run: bash deploy/state.sh restore

      - name: Screen
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          MARKET: ${{ inputs.market }}
        run: .venv/bin/python -m tracks.main.s1_vwap --out state/s1 --market "$MARKET"

      - name: Commit the results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_BRANCH: state-s1
          RUN_LABEL: s1-screen ${{ github.run_id }}-${{ github.run_attempt }}
        run: bash deploy/state.sh save
