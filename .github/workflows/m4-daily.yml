# M4 nightly: today's long-horizon ranking and dashboard (tracks/main/longterm/live.py).
# Scheduled runs after 10pm ET only do work on the last session of a week or month (the forward logs);
# the dashboard otherwise refreshes on demand (workflow_dispatch, started by the dashboard's button).
# Writes state/longterm/ (latest.json, dashboard.html and the hash-chained forward log) to the orphan
# branch `state`.
name: m4-daily

# This public copy is the one that runs nightly (the private repo skips scheduled jobs).
on:
  schedule:
    - cron: "30 3 * * 2-6"   # 23:30 ET in EDT, 22:30 in EST, after each weekday session
  workflow_dispatch:

permissions: {}

concurrency:
  group: state-writer
  cancel-in-progress: false

jobs:
  rank:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Python and packages
        run: |
          uv python install 3.12.10
          uv venv --python 3.12.10 .venv
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: Restore the state branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/state.sh restore

      - name: Rank and build the dashboard
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: .venv/bin/python -m tracks.main.longterm.live --state state --cache cache/m4live ${{ github.event_name == 'schedule' && '--log-days-only' || '' }}

      - name: M3 picks on a month end (tracks/main/m3_live.py)
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: .venv/bin/python -m tracks.main.m3_live --state state

      - name: Timestamp the ledger head outside GitHub (OpenTimestamps; never blocks the run)
        if: always()
        continue-on-error: true
        run: |
          led=state/longterm/ledger.jsonl
          [[ -s "$led" ]] || exit 0
          mkdir -p state/ots
          uv pip install --python .venv/bin/python opentimestamps-client==0.7.2
          head_line=$(tail -n 1 "$led")
          last=$(ls state/ots/head-*.txt 2>/dev/null | sort | tail -n 1 || true)
          if [[ -z "$last" || "$(cat "$last")" != "$head_line" ]]; then
            f="state/ots/head-$(date -u +%Y%m%dT%H%M%SZ).txt"
            printf '%s' "$head_line" > "$f"
            .venv/bin/ots stamp "$f"
          fi
          # turn pending proofs into Bitcoin-anchored ones once they confirm (a few hours later)
          for p in state/ots/*.ots; do
            [[ -f "$p.btc" ]] && continue
            .venv/bin/ots upgrade "$p" || true
            .venv/bin/ots info "$p" 2>/dev/null | grep -q BitcoinBlockHeaderAttestation && touch "$p.btc"
          done

      - name: Commit the state back
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_LABEL: m4-daily ${{ github.run_id }}-${{ github.run_attempt }}
        run: bash deploy/state.sh save
