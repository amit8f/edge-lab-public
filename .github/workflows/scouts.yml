# SYS2B: the scout picker (adaptive/scouts.py, research/prereg/SYS2B.md). One job runs a pass every 5 minutes
# for up to 5h30m, saving to the orphan branch `state-scouts` after each pass, then queues the next job until
# the session is over. Raw evidence (headline and filing text, web sources, the agents' answers) is pushed
# only to the private amit8f/edge-lab repository, branch `evidence`, with the EVIDENCE_TOKEN secret.
# Shadow books only: no Alpaca orders. Free on a public repo; disable the workflow to stop it.
name: scouts

on:
  schedule:
    - cron: "20 13 * * 1-5"
    - cron: "20 14 * * 1-5"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scouts-state
  cancel-in-progress: false

jobs:
  scouts:
    if: github.repository != 'amit8f/edge-lab'
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Python and packages
        run: |
          uv python install 3.12.10
          uv venv --python 3.12.10 .venv
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: Restore the state and evidence branches
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_TOKEN: ${{ secrets.EVIDENCE_TOKEN }}
        run: |
          STATE_BRANCH=state-scouts bash deploy/state.sh restore
          GH_TOKEN="$EVIDENCE_TOKEN" STATE_REMOTE=https://github.com/amit8f/edge-lab.git STATE_BRANCH=evidence \
            STATE_DIR=evidence bash deploy/state.sh restore

      - name: A pass every 5 minutes
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_TOKEN: ${{ secrets.EVIDENCE_TOKEN }}
          RUN_LABEL: scouts ${{ github.run_id }}-${{ github.run_attempt }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          save() {
            STATE_BRANCH=state-scouts bash deploy/state.sh save || echo "::warning::state save failed"
            GH_TOKEN="$EVIDENCE_TOKEN" STATE_REMOTE=https://github.com/amit8f/edge-lab.git STATE_BRANCH=evidence \
              STATE_DIR=evidence bash deploy/state.sh save || echo "::warning::evidence save failed"
          }
          stop=$(( $(date +%s) + 330 * 60 ))
          rc=0
          while (( $(date +%s) < stop )); do
            rc=0; .venv/bin/python -m adaptive.scouts --state state --evidence evidence --cache /tmp/scouts.pkl || rc=$?
            if (( rc == 3 )); then echo "session over"; touch /tmp/session_over; break; fi
            (( rc == 1 )) && echo "::warning::pass failed; next slot goes on"
            save
            now=$(date +%s); next=$(( now / 300 * 300 + 300 + 40 ))
            (( next >= stop )) && break
            sleep $(( next - now ))
          done

      - name: Save the state and evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_TOKEN: ${{ secrets.EVIDENCE_TOKEN }}
          RUN_LABEL: scouts ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          STATE_BRANCH=state-scouts bash deploy/state.sh save
          GH_TOKEN="$EVIDENCE_TOKEN" STATE_REMOTE=https://github.com/amit8f/edge-lab.git STATE_BRANCH=evidence \
            STATE_DIR=evidence bash deploy/state.sh save

      - name: Queue the next job unless the session is over
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [[ -f /tmp/session_over ]]; then echo "done for today"; exit 0; fi
          others=$(gh run list -R "$REPO" --workflow scouts.yml --limit 20 --json databaseId,status \
            --jq "[.[] | select(.databaseId != $RUN_ID and (.status == \"queued\" or .status == \"in_progress\" or .status == \"pending\" or .status == \"waiting\"))] | length")
          if [[ "$others" == "0" ]]; then gh workflow run scouts.yml -R "$REPO" --ref main; echo queued; else echo "another run is queued"; fi
