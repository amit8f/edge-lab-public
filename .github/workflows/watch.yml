# SYS2: the all-day picker (adaptive/watch.py, research/prereg/SYS2.md). One job runs a pass every 5 minutes
# for up to 5h30m, saving to the orphan branch `state-watch` after each pass, then queues the next job until
# the session is over. The crons only start the day (DST-proof: the code waits for the open). Shadow books
# only: no Alpaca orders. Free on a public repo; disable the workflow to stop it.
name: watch

on:
  schedule:
    - cron: "20 13 * * 1-5"
    - cron: "20 14 * * 1-5"
  workflow_dispatch:

permissions: {}

concurrency:
  group: watch-state
  cancel-in-progress: false

jobs:
  watch:
    if: github.repository != 'amit8f/edge-lab'
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Python and packages
        run: |
          uv python install 3.12.10
          uv venv --python 3.12.10 .venv
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: Restore the state branch
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_BRANCH: state-watch
        run: bash deploy/state.sh restore

      - name: A pass every 5 minutes
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_BRANCH: state-watch
          RUN_LABEL: watch ${{ github.run_id }}-${{ github.run_attempt }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: |
          stop=$(( $(date +%s) + 330 * 60 ))
          rc=0
          while (( $(date +%s) < stop )); do
            rc=0; .venv/bin/python -m adaptive.watch --state state || rc=$?
            if (( rc == 3 )); then echo "session over"; touch /tmp/session_over; break; fi
            (( rc == 1 )) && echo "::warning::pass failed; next slot goes on"
            bash deploy/state.sh save || echo "::warning::state save failed"
            now=$(date +%s); next=$(( now / 300 * 300 + 300 + 20 ))
            (( next >= stop )) && break
            sleep $(( next - now ))
          done

      - name: Save the state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_BRANCH: state-watch
          RUN_LABEL: watch ${{ github.run_id }}-${{ github.run_attempt }}
        run: bash deploy/state.sh save

      - name: Queue the next job unless the session is over
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [[ -f /tmp/session_over ]]; then echo "done for today"; exit 0; fi
          others=$(gh run list -R "$REPO" --workflow watch.yml --limit 20 --json databaseId,status \
            --jq "[.[] | select(.databaseId != $RUN_ID and (.status == \"queued\" or .status == \"in_progress\" or .status == \"pending\" or .status == \"waiting\"))] | length")
          if [[ "$others" == "0" ]]; then gh workflow run watch.yml -R "$REPO" --ref main; echo queued; else echo "another run is queued"; fi
