# W1 (research/prereg/W1.md): W1a leak reports (tracks/news/w1a_leaks.py), W1b unexplained heavy trading
# (tracks/main/w1b_volume.py), W1c unusual calls (tracks/main/w1c_calls.py). Manual runs only. Each stage
# resumes from its cache; rerun a stage until it finishes. Order:
#   part=w1a stage=data (shared by all three), then w1a events, details (writes the hand check), gdelt;
#   the hand check of research/results/W1/W1a_check.csv; then w1a measure, report.
#   part=w1b stage=signals, proxy, footprints, finra, seclist, runup; report after W1b_sec_cases.csv is filled.
#   part=w1c stage=probe, options, report.
# Own data cache (cache/w1). Results are committed back to the branch that ran it.
name: w1-study

on:
  workflow_dispatch:
    inputs:
      part:
        description: "w1a, w1b or w1c"
        required: true
        default: w1a
      stage:
        description: "the part's stage (see the header of this file)"
        required: true
        default: data

permissions: {}

jobs:
  screen:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Python and packages
        run: |
          uv python install 3.12.10
          uv venv --python 3.12.10 .venv
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: Check secrets are present
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          [[ -n "$ALPACA_API_KEY_ID" ]] || { echo "::error::secret ALPACA_API_KEY_ID is missing"; exit 1; }
          [[ -n "$SEC_USER_AGENT" ]] || { echo "::error::secret SEC_USER_AGENT is missing (your name and email, required by SEC)"; exit 1; }

      - name: Restore the data cache
        uses: actions/cache/restore@v4
        with:
          path: cache/w1
          key: w1-v1-${{ github.run_id }}
          restore-keys: w1-v1-

      - name: Run the stage
        env:
          PART: ${{ github.event.inputs.part }}
          STAGE: ${{ github.event.inputs.stage }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          case "$PART" in
            w1a) mod=tracks.news.w1a_leaks ;;
            w1b) mod=tracks.main.w1b_volume ;;
            w1c) mod=tracks.main.w1c_calls ;;
            *) echo "::error::part must be w1a, w1b or w1c"; exit 1 ;;
          esac
          .venv/bin/python -m "$mod" --stage "$STAGE" --cache cache/w1 --out research/results/W1 --budget-min 290

      - name: Save the data cache (also after a failure, so a rerun skips the downloads)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache/w1
          key: w1-v1-${{ github.run_id }}

      - name: Commit the results to this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p research/results/W1 && git add research/results/W1
          git diff --cached --quiet && { echo "No results yet (stage unfinished); rerun to continue"; exit 0; }
          git commit -q -m "W1 ${{ github.event.inputs.part }} output (run ${{ github.run_id }})"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=$auth" pull -q --rebase origin "${GITHUB_REF_NAME}"
          git -c "http.extraheader=$auth" push -q origin "HEAD:${GITHUB_REF_NAME}"
