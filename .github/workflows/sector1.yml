# SECTOR1 stage 1 (tracks/main/sector1_study.py, research/prereg/SECTOR1.md): daily moves by sector, 2019-2023.
# Manual start. Reads W1's daily cache (read only) and EDGAR SIC codes; commits only the summary JSON.
name: sector1

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "1 (daily moves), 2 (earnings, news, rates, oil) 3 (variance breakdown) or 4 (market and sector early signs)"
        type: choice
        options: ["1", "2", "3", "4", "boomcheck", "newsprobe", "warm", "backup", "borrowprobe", "newsrestore", "numeraiprobe", "numeraidata", "numeraitrain", "numeraisubmit", "numeraiexport"]
        default: "1"

permissions: {}

concurrency:
  group: sector1
  cancel-in-progress: false

jobs:
  run:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Python and packages
        run: |
          uv python install 3.12.10
          uv venv --python 3.12.10 .venv
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: Restore W1's daily cache (read only)
        if: ${{ !startsWith(inputs.stage, 'numerai') }}
        uses: actions/cache/restore@v4
        with:
          path: cache/w1
          key: w1-v1-none
          restore-keys: w1-v1-

      - name: Fall back to the NX1 cache, which holds a copy of W1's data (caches get evicted)
        if: ${{ !startsWith(inputs.stage, 'numerai') && hashFiles('cache/w1/w1/daily/**') == '' }}
        uses: actions/cache/restore@v4
        with:
          path: cache/nx1
          key: nx1-v1-none
          restore-keys: nx1-v1-

      - name: Bring back the old headline months from the encrypted backup if the cache lost them
        if: inputs.stage == '2' || inputs.stage == '3' || inputs.stage == '4' || inputs.stage == 'backup'
        env:
          EVIDENCE_TOKEN: ${{ secrets.EVIDENCE_TOKEN }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: bash deploy/news_restore.sh cache/nx1/g1/news

      - name: Restore the SIC cache
        uses: actions/cache/restore@v4
        with:
          path: cache/sector1
          key: sector1-v1-${{ github.run_id }}
          restore-keys: sector1-v1-

      - name: Restore NUM1's Numerai cache (model and downloaded datasets)
        if: startsWith(inputs.stage, 'numerai')
        uses: actions/cache/restore@v4
        with:
          path: cache/numerai
          key: numerai-v1-${{ github.run_id }}
          restore-keys: numerai-v1-

      - name: Run the stage
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          EVIDENCE_TOKEN: ${{ secrets.EVIDENCE_TOKEN }}
          NUMERAI_PUBLIC_ID: ${{ secrets.NUMERAI_PUBLIC_ID }}
          NUMERAI_SECRET_KEY: ${{ secrets.NUMERAI_SECRET_KEY }}
          STAGE: ${{ inputs.stage }}
        run: |
          set -o pipefail
          if [[ "$STAGE" == backup ]]; then
            # Amit 2026-11-21 ("Warm + private"): Alpaca no longer serves old headlines, so NX1's Benzinga months
            # (cache/nx1/g1/news) go, encrypted, to a release of the private amit8f/edge-lab repo. Passphrase: the
            # ALPACA_API_SECRET_KEY secret (decrypt: openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ALPACA_API_SECRET_KEY).
            n=$(ls cache/nx1/g1/news/news_*.parquet | wc -l)
            [[ $n -ge 100 ]] || { echo "::error::only $n news months in the cache"; exit 1; }
            tag="news-backup-$(date -u +%Y%m%d)"
            tar -C cache/nx1/g1 -cf - news | gzip -1 | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:ALPACA_API_SECRET_KEY -out /tmp/benzinga_news.tar.gz.enc
            ( cd cache/nx1/g1/news && sha256sum news_*.parquet ) > /tmp/benzinga_news.sha256
            ls -l /tmp/benzinga_news.tar.gz.enc; echo "$n months"
            GH_TOKEN="$EVIDENCE_TOKEN" gh release create "$tag" /tmp/benzinga_news.tar.gz.enc /tmp/benzinga_news.sha256 \
              --repo amit8f/edge-lab --title "Benzinga news months backup ($n months)" \
              --notes "Encrypted copy of NX1's cached Benzinga headline months (cache/nx1/g1/news). Alpaca stopped serving old news in 2026. See edge-lab-public sector1.yml stage backup."
            GH_TOKEN="$EVIDENCE_TOKEN" gh release view "$tag" --repo amit8f/edge-lab --json assets --jq '.assets[]|.name+" "+(.size|tostring)'
            exit 0
          fi
          if [[ "$STAGE" == warm ]]; then
            echo "caches restored (keeps them from expiring): nx1 $(du -sh cache/nx1 | cut -f1), w1 $(du -sh cache/w1 2>/dev/null | cut -f1), sector1 $(du -sh cache/sector1 2>/dev/null | cut -f1)"
            exit 0
          fi
          if [[ "$STAGE" == numeraidata || "$STAGE" == numeraitrain || "$STAGE" == numeraisubmit || "$STAGE" == numeraiexport ]]; then
            free -g; df -h /mnt | tail -1
            uv pip install --python .venv/bin/python -q numerapi==3.1.1
            PYTHONPATH=. timeout 150m .venv/bin/python -u -m tracks.numerai.signals --stage ${STAGE#numerai} --cache cache/numerai --out research/results/NUM1
            exit 0
          fi
          if [[ "$STAGE" == numeraiprobe ]]; then
            uv pip install --python .venv/bin/python -q numerapi==3.1.1
            PYTHONPATH=. .venv/bin/python -u -m tracks.tools.numerai_probe; exit 0
          fi
          if [[ "$STAGE" == newsrestore ]]; then
            # Proof that a job with no cache gets every old headline month back from the encrypted backup.
            bash deploy/news_restore.sh /tmp/newstest && ls /tmp/newstest | wc -l && du -sh /tmp/newstest; exit 0
          fi
          if [[ "$STAGE" == borrowprobe ]]; then
            PYTHONPATH=. .venv/bin/python -m tracks.tools.borrow_log --print-only; exit 0
          fi
          if [[ "$STAGE" == newsprobe ]]; then
            PYTHONPATH=. .venv/bin/python -u -m tracks.tools.news_probe
            exit 0
          fi
          if [[ "$STAGE" == boomcheck ]]; then
            PYTHONPATH=. .venv/bin/python -u -m tracks.tools.boom_check research/results/boom_live_picks.json
            exit 0
          fi
          w1=cache/w1; [[ -d cache/w1/w1/daily ]] || w1=cache/nx1
          [[ -d $w1/w1/daily ]] || { echo "::error::W1's daily cache is missing"; exit 1; }
          echo "W1 data from $w1: $(ls $w1/w1) / news: $(ls $w1/g1/news 2>/dev/null | wc -l) months"
          mod=tracks.main.sector1_study; [[ "$STAGE" == 2 ]] && mod=tracks.main.sector2_study; [[ "$STAGE" == 3 ]] && mod=tracks.main.sector3_study; [[ "$STAGE" == 4 ]] && mod=tracks.main.sector4_study
          PYTHONPATH=. .venv/bin/python -u -m "$mod" --w1 "$w1" --out research/results/SECTOR1 --cache cache/sector1 $([[ "$STAGE" == 2 || "$STAGE" == 3 || "$STAGE" == 4 ]] && echo --minutes 280)

      - name: Save the SIC cache
        if: always() && inputs.stage != 'warm' && inputs.stage != 'newsprobe' && inputs.stage != 'boomcheck' && inputs.stage != 'backup' && inputs.stage != 'borrowprobe' && inputs.stage != 'newsrestore' && inputs.stage != 'numeraiprobe' && !startsWith(inputs.stage, 'numerai')
        uses: actions/cache/save@v4
        with:
          path: cache/sector1
          key: sector1-v1-${{ github.run_id }}

      - name: Save NUM1's Numerai cache
        if: (inputs.stage == 'numeraitrain' || inputs.stage == 'numeraidata') && success()
        uses: actions/cache/save@v4
        with:
          path: cache/numerai
          key: numerai-v1-${{ github.run_id }}

      - name: Commit the results to this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p research/results/NUM1 models/num1 && git add research/results/SECTOR1 research/results/NUM1 models/num1
          git diff --cached --quiet && { echo "Nothing new to commit"; exit 0; }
          git commit -q -m "SECTOR1 stage ${{ inputs.stage }} results (run ${{ github.run_id }})"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=$auth" pull -q --rebase origin "${GITHUB_REF_NAME}"
          git -c "http.extraheader=$auth" push -q origin "HEAD:${GITHUB_REF_NAME}"
