# B0 burst base rates (research/prereg/B0.md, tracks/penny/b0_study.py). Manual runs only, in order:
#   stage=bars until it prints "bars complete", then match, then sources until "sources complete",
#   then features, then report. The long stages resume where the last run stopped.
# The report is committed back to the branch that ran it (research/results/B0/).
name: b0-study

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "bars, match, sources, features or report"
        required: true
        default: bars

permissions: {}

jobs:
  study:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Python and packages
        run: |
          uv python install 3.12.10
          uv venv --python 3.12.10 .venv
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: Restore the data cache
        uses: actions/cache/restore@v4
        with:
          path: cache/b0
          key: b0-v1-${{ github.run_id }}
          restore-keys: b0-v1-

      - name: Run the stage
        env:
          STAGE: ${{ github.event.inputs.stage }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: .venv/bin/python -m tracks.penny.b0_study --stage "$STAGE" --cache cache/b0 --out research/results/B0 --budget-min 300

      - name: Save the data cache (also after a failure)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache/b0
          key: b0-v1-${{ github.run_id }}

      - name: Commit the results to this branch
        if: github.event.inputs.stage == 'report'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/B0
          if git diff --cached --quiet; then echo "no new results"; exit 0; fi
          git commit -q -m "B0 study output (run ${{ github.run_id }})"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=$auth" pull -q --rebase origin "${GITHUB_REF_NAME}"
          git -c "http.extraheader=$auth" push -q origin "HEAD:${GITHUB_REF_NAME}"
