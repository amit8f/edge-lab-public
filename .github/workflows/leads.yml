# Leading sources, forward only: clinicaltrials.gov updates of industry-sponsored studies (core/leads.py)
# and SEC filings that often precede headlines (core/leads_sec.py), saved to the orphan branch `state` under leads/. (Pentagon contract pages are blocked from GitHub's
# servers, so they are not collected here.) Runs once a night; the cursor fills any day a skipped run
# missed. The same job runs the penny track's P1/P2 paper trading (tracks/penny/nightly.py), which does
# nothing before the night of 2026-10-19 and needs the night's articles up to 23:30 ET, and P4's paper
# trading (tracks/penny/p4_live.py), from the night of 2026-10-23.
name: leads

# This public copy is the one that runs nightly: the private repo has used its Actions minutes and
# skips scheduled jobs (only its news logger runs there). Headline text isn't stored here
# (NO_HEADLINE_TEXT), since Benzinga's terms don't allow republishing it.
on:
  schedule:
    - cron: "45 4 * * 2-6"    # 23:45 ET (EST, from Nov 1; 00:45 in EDT), Mon-Fri nights
  workflow_dispatch:

permissions: {}

concurrency:
  group: state-writer
  cancel-in-progress: false

jobs:
  collect:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Python and packages
        run: |
          uv python install 3.12.10
          uv venv --python 3.12.10 .venv
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: Restore the state branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/state.sh restore

      - name: Collect trials
        run: .venv/bin/python -m core.leads --state state

      - name: Collect SEC filings
        if: always()
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: .venv/bin/python -m core.leads_sec --state state

      - name: Borrow fees (Interactive Brokers' public stock-loan file)
        if: always()
        run: .venv/bin/python -m core.borrow --state state

      - name: Paper trading, P1 and P2 (Alpaca paper account only)
        if: always()
        env:
          # Its own paper account (EL-P1P2) once those secrets exist; the shared key until then.
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_P1P2_KEY_ID || secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_P1P2_SECRET_KEY || secrets.ALPACA_API_SECRET_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          NO_HEADLINE_TEXT: "1"
        run: .venv/bin/python -m tracks.penny.nightly --state state

      - name: Restore DERA insider purchases (P4's routine-buyer test)
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: cache/p4live
          key: p4-live-dera-v1-${{ github.run_id }}
          restore-keys: p4-live-dera-v1-

      - name: Paper trading, P4 insider cluster buys (EL-P4 paper account only)
        if: always()
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ALPACA_P4_KEY_ID: ${{ secrets.ALPACA_P4_KEY_ID }}
          ALPACA_P4_SECRET_KEY: ${{ secrets.ALPACA_P4_SECRET_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ADAPTIVE_SEND: ${{ vars.ADAPTIVE_SEND }}
        run: .venv/bin/python -m tracks.penny.p4_live --state state --cache cache/p4live

      - name: Save DERA insider purchases
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: cache/p4live
          key: p4-live-dera-v1-${{ github.run_id }}

      - name: L1 forward shadow books (FWD1; logs only, no orders)
        if: always()
        continue-on-error: true
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: .venv/bin/python -m tracks.news.l1_live --state state

      - name: SP1 spin-off log (logs only, no orders)
        if: always()
        continue-on-error: true
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: .venv/bin/python -m tracks.main.sp1_live --state state

      - name: Commit the state back
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_LABEL: leads ${{ github.run_id }}-${{ github.run_attempt }}
        run: bash deploy/state.sh save
