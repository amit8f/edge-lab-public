# Outside timestamps for pre-registrations (research/PROTOCOL.md rule 13, core/timestamps.py). Runs when a
# pre-registration changes on main, and weekly to upgrade pending proofs. About a minute per run.
name: timestamps

on:
  push:
    branches: [main]
    paths: ["research/prereg/**"]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: state-writer
  cancel-in-progress: false

jobs:
  stamp:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.13.0"

      - name: Python and the OpenTimestamps client
        run: |
          uv python install 3.12.10
          uv venv --python 3.12.10 .venv
          uv pip install --python .venv/bin/python opentimestamps-client==0.7.2

      - name: Restore the state branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/state.sh restore

      - name: Stamp new pre-registration versions and upgrade pending proofs
        run: PATH="$PWD/.venv/bin:$PATH" .venv/bin/python -m core.timestamps --proofs state/timestamps

      - name: Commit the state back
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_LABEL: timestamps ${{ github.run_id }}-${{ github.run_attempt }}
        run: bash deploy/state.sh save
