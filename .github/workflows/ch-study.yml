# CH (research/prereg/CH.md): chart-model arms, main and penny. Manual runs only, one at a time (own cache
# cache/w1/ch, beside W1's daily cache, which it only reads). Order:
#   stage=candidates, stage=context, then stage=build (rerun until CH_build_progress.json says finished),
#   then stage=check (research/checks/CH.csv; hand-check.yml pulls each row's 5-minute bars), the hand check,
#   then stage=trees, stage=treesr (CHR-P), stage=img (rerun until all years are saved) and stage=measure.
name: ch-study

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "candidates, context, build, rebase, check, trees, treesr, img or measure"
        required: true
        default: candidates

permissions: {}

jobs:
  run:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Python and packages
        run: |
          uv python install 3.12.10
          uv venv --python 3.12.10 .venv
          uv pip install --python .venv/bin/python -r requirements.txt
          if [[ "${{ github.event.inputs.stage }}" == img ]]; then
            uv pip install --python .venv/bin/python torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          fi

      - name: Check secrets are present
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          [[ -n "$ALPACA_API_KEY_ID" ]] || { echo "::error::secret ALPACA_API_KEY_ID is missing"; exit 1; }
          [[ -n "$SEC_USER_AGENT" ]] || { echo "::error::secret SEC_USER_AGENT is missing"; exit 1; }

      - name: Restore W1's daily cache (read only)
        uses: actions/cache/restore@v4
        with:
          path: cache/w1
          key: w1-v1-none
          restore-keys: w1-v1-

      - name: Restore CH's cache
        uses: actions/cache/restore@v4
        with:
          path: cache/w1/ch
          key: ch-v1-${{ github.run_id }}
          restore-keys: ch-v1-

      - name: Run the stage
        env:
          STAGE: ${{ github.event.inputs.stage }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          [[ -d cache/w1/w1/daily ]] || { echo "::error::W1's daily cache is missing; run w1-study part=w1a stage=data first"; exit 1; }
          case "$STAGE" in
            candidates|context|build|rebase) mod=tracks.main.ch_data ;;
            check|trees|treesr|img|measure) mod=tracks.main.ch_study ;;
            *) echo "::error::unknown stage $STAGE"; exit 1 ;;
          esac
          .venv/bin/python -m "$mod" --stage "$STAGE" --cache cache/w1 --out research/results/CH --budget-min 320

      - name: Save CH's cache (also after a failure, so a rerun resumes)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache/w1/ch
          key: ch-v1-${{ github.run_id }}

      - name: Commit the results to this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p research/results/CH research/checks
          git add research/results/CH research/checks
          git diff --cached --quiet && { echo "No results yet"; exit 0; }
          git commit -q -m "CH ${{ github.event.inputs.stage }} output (run ${{ github.run_id }})"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=$auth" pull -q --rebase origin "${GITHUB_REF_NAME}"
          git -c "http.extraheader=$auth" push -q origin "HEAD:${GITHUB_REF_NAME}"
