# One-off check of outside data sources from GitHub's servers (core/probe.py). Manual runs only; about a minute.
name: probe-sources

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Probe
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: pip install -q requests==2.34.2 pypdf==6.21.1 && python -m core.probe
