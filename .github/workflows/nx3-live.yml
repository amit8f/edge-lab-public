# NX3 live scorer and $5,000 shadow book (tracks/news/nx3_live.py, research/prereg/NX3.md). Ledger only: no
# orders. One job polls Alpaca's news every 30 seconds from the open until the last decision, saving to the
# orphan branch `state-nx3` every 20 minutes, then queues the next job; after the close it logs the day and
# settles the day before. The crons only start the day (DST-proof: the code waits for the open).
name: nx3-live

on:
  schedule:
    - cron: "15 13 * * 1-5"
    - cron: "15 14 * * 1-5"
  workflow_dispatch:
    inputs:
      check:
        description: "true = read every source once and print counts (no state)"
        required: false
        default: "false"

permissions: {}

concurrency:
  group: nx3-state
  cancel-in-progress: false

jobs:
  live:
    if: github.repository != 'amit8f/edge-lab'
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Python and packages (CPU-only torch for FinBERT)
        run: |
          uv python install 3.12.10
          uv venv --python 3.12.10 .venv
          uv pip install --python .venv/bin/python -r requirements.txt
          uv pip install --python .venv/bin/python torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .venv/bin/python transformers==5.18.0

      - name: Check the sources once
        if: inputs.check == 'true'
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: PYTHONPATH=. .venv/bin/python -m tracks.news.nx3_live --check

      - name: Restore the state branch
        if: inputs.check != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_BRANCH: state-nx3
        run: bash deploy/state.sh restore

      - name: Score the session, saving every 20 minutes
        if: inputs.check != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_BRANCH: state-nx3
          RUN_LABEL: nx3-live ${{ github.run_id }}-${{ github.run_attempt }}
          PYTHONUNBUFFERED: "1"      # log lines carry the time they happened, not the flush time
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ALPACA_NX3_KEY_ID: ${{ secrets.ALPACA_NX3_KEY_ID }}
          ALPACA_NX3_SECRET_KEY: ${{ secrets.ALPACA_NX3_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}     # NXS-LLM sizes, once a day after the close
        run: |
          stop=$(( $(date +%s) + 330 * 60 ))
          while (( $(date +%s) + 20 * 60 < stop )); do
            rc=0; PYTHONPATH=. .venv/bin/python -m tracks.news.nx3_live --state state --minutes 20 || rc=$?
            if (( rc == 3 )); then echo "done for today"; touch /tmp/session_over; break; fi
            (( rc != 0 )) && { echo "::warning::nx3_live exited $rc; restarting"; sleep 10; }
            bash deploy/state.sh save || echo "::warning::state save failed"
          done

      - name: Save the state
        if: always() && inputs.check != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_BRANCH: state-nx3
          RUN_LABEL: nx3-live ${{ github.run_id }}-${{ github.run_attempt }}
        run: bash deploy/state.sh save

      - name: Queue the next job unless the day is done
        if: always() && inputs.check != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [[ -f /tmp/session_over ]]; then echo "done for today"; exit 0; fi
          others=$(gh run list -R "$REPO" --workflow nx3-live.yml --limit 20 --json databaseId,status \
            --jq "[.[] | select(.databaseId != $RUN_ID and (.status == \"queued\" or .status == \"in_progress\" or .status == \"pending\" or .status == \"waiting\"))] | length")
          if [[ "$others" == "0" ]]; then gh workflow run nx3-live.yml -R "$REPO" --ref main; echo queued; else echo "another run is queued"; fi
