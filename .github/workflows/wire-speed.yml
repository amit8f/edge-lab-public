# WIRE0 (research/prereg/WIRE0.md, descriptive): the listener's wire log vs Benzinga's times. Manual start.
# Commits only the summary numbers (no headlines).
name: wire-speed

on:
  workflow_dispatch:
    inputs:
      days:
        description: "most recent finished days of the listener log to read"
        required: false
        default: "20"

permissions: {}

concurrency:
  group: wire-speed
  cancel-in-progress: false

jobs:
  speed:
    if: github.repository != 'amit8f/edge-lab'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: The listener's log
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: state-listen
          path: state-listen
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Python and packages
        run: |
          uv python install 3.12.10
          uv venv --python 3.12.10 .venv
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: Speed report
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          DAYS: ${{ inputs.days || '20' }}
        run: PYTHONPATH=. .venv/bin/python -u -m tracks.news.wire_speed --listen state-listen --out research/results/WIRE0 --days "$DAYS"

      - name: Commit the summary to this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/WIRE0
          git diff --cached --quiet && { echo "Nothing new to commit"; exit 0; }
          git commit -q -m "WIRE0 speed report (run ${{ github.run_id }})"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=$auth" pull -q --rebase origin "${GITHUB_REF_NAME}"
          git -c "http.extraheader=$auth" push -q origin "HEAD:${GITHUB_REF_NAME}"
