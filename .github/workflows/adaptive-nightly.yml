# Plan v3 ranking strategies (adaptive/nightly.py, research/prereg/SYS1.md): M4 and M6 each trade their own
# Alpaca paper account (EL-M4, EL-M6) on the nights M4 or M8 log new picks, after m4-daily has logged them.
# Dry run (orders logged, not sent) until the repository variable ADAPTIVE_SEND is set to 1.
name: adaptive-nightly

on:
  schedule:
    - cron: "15 4 * * 2-6"   # 00:15 ET in EDT (23:15 in EST), after m4-daily
  workflow_dispatch:

permissions: {}

concurrency:
  group: state-writer
  cancel-in-progress: false

jobs:
  trade:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Python and packages
        run: |
          uv python install 3.12.10
          uv venv --python 3.12.10 .venv
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: Restore the state branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/state.sh restore

      - name: Ranking strategies (paper accounts only)
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ALPACA_M4_KEY_ID: ${{ secrets.ALPACA_M4_KEY_ID }}
          ALPACA_M4_SECRET_KEY: ${{ secrets.ALPACA_M4_SECRET_KEY }}
          ALPACA_M6_KEY_ID: ${{ secrets.ALPACA_M6_KEY_ID }}
          ALPACA_M6_SECRET_KEY: ${{ secrets.ALPACA_M6_SECRET_KEY }}
          ADAPTIVE_SEND: ${{ vars.ADAPTIVE_SEND }}
        run: .venv/bin/python -m adaptive.nightly --state state

      - name: Commit the state back
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_LABEL: adaptive-nightly ${{ github.run_id }}-${{ github.run_attempt }}
        run: bash deploy/state.sh save
