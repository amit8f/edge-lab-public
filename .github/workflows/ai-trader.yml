# K2 hourly: the $100 AI stock paper trader (tracks/main/ai_trader.py, research/prereg/K2.md).
# Runs each hour of the US session (the code skips runs whose price time, now - 16 min, is outside it),
# logs to the orphan branch `state-ai` so hourly runs never race the nightly jobs on `state`.
# GitHub's cron never fired for this new repo on 2026-10-16, so each run also queues the next one itself:
# the `next` job waits until minute 7 of the coming hour and dispatches this workflow again (free on a public
# repo; no Claude involved). Only one chain runs: it skips the dispatch when another run is already queued.
# On Saturdays around 03:07 UTC it also starts the weekly Kronos job (which logs at most once per week).
name: ai-trader

on:
  schedule:
    - cron: "7 13-21 * * 1-5"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ai-state
  cancel-in-progress: false

jobs:
  trade:
    if: github.repository != 'amit8f/edge-lab'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Python and packages
        run: |
          uv python install 3.12.10
          uv venv --python 3.12.10 .venv
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: Restore the AI-trader state branch
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_BRANCH: state-ai
        run: bash deploy/state.sh restore

      - name: One hourly step
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ALPACA_MIRROR_KEY_ID: ${{ secrets.ALPACA_MIRROR_KEY_ID }}
          ALPACA_MIRROR_SECRET_KEY: ${{ secrets.ALPACA_MIRROR_SECRET_KEY }}
        run: .venv/bin/python -m tracks.main.ai_trader --state state

      - name: Commit the state back
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_BRANCH: state-ai
          RUN_LABEL: ai-trader ${{ github.run_id }}-${{ github.run_attempt }}
        run: bash deploy/state.sh save

  next:
    needs: trade
    if: always() && github.repository != 'amit8f/edge-lab'
    permissions:
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Wait for the next hour and queue it
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          now=$(date -u +%s)
          next=$(( (now / 3600 + 1) * 3600 + 7 * 60 ))
          echo "sleeping $(( next - now ))s until $(date -u -d @$next +%H:%M) UTC"
          sleep $(( next - now ))
          others=$(gh run list -R "$REPO" --workflow ai-trader.yml --limit 20 --json databaseId,status \
            --jq "[.[] | select(.databaseId != $RUN_ID and (.status == \"queued\" or .status == \"in_progress\" or .status == \"pending\" or .status == \"waiting\"))] | length")
          if [[ "$others" == "0" ]]; then gh workflow run ai-trader.yml -R "$REPO" --ref main; echo queued; else echo "another run is queued; not chaining"; fi
          if [[ "$(date -u +%u)" == "6" && "$(date -u +%H)" == "03" ]]; then
            gh workflow run kronos-weekly.yml -R "$REPO" --ref main -f dry_run=false && echo "kronos queued"
          fi
