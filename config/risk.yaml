# Risk and cost rules per track (docs/PLAN_V2.md, "Risk rules"). A pre-registration may override a value
# for its own idea, and must say so. Fractions, not percent: 0.005 = 0.5%.
account:
  paper_start_usd: 5000
  pause_drawdown: 0.15          # whole paper account: stop opening positions below -15% from its peak
  # One book across tracks (research/PROTOCOL.md, added 2026-10-15). A future burst sleeve (B1, if B0
  # passes) would take 10% out of main and penny.
  sleeves: {main: 0.45, penny: 0.25, news: 0.30}   # shares of the start used for each track's drawdown brake
  max_gross: 1.5                # long + short notional, all tracks, <= 1.5 x equity
  max_name: 0.20                # one symbol across all tracks <= 20% of equity (the largest single position)
  max_open_risk: 0.06           # sum of notional x stop distance <= 6% of equity (all stops hit at once)

tracks:
  main:
    risk_per_trade: 0.005       # equity at risk to the stop
    max_positions: 10
    max_per_industry: 2
    pause_drawdown: 0.10        # track sleeve
    atr_mult: 3.0
    long_stop_cap: 0.15         # stop distance never wider than this
    short_stop_cap: 0.20
    take_profit: null
    round_trip_cost: 0.002      # spread + slippage, both sides together
    borrow_per_year: 0.03
  penny:
    risk_per_trade: 0.0025
    max_positions: 5
    max_per_industry: 2
    pause_drawdown: 0.10
    atr_mult: 3.0
    long_stop_cap: 0.25
    short_stop_cap: 0.35
    take_profit: null
    round_trip_cost: 0.02
    borrow_per_year: 0.20
  news:
    risk_per_trade: 0.005
    max_positions: 5
    max_per_industry: 2
    pause_drawdown: 0.10
    atr_mult: 2.5
    long_stop_cap: 0.12
    short_stop_cap: 0.15
    take_profit: null
    round_trip_cost: 0.002      # news trades in $5+ stocks; a penny news idea must use penny costs
    borrow_per_year: 0.03
